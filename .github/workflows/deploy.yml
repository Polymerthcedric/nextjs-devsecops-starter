# Continuous deployment: production on every push to main.
#
# Setup (one-time):
#   1. Create a Vercel project and import this repo (framework: Next.js).
#   2. Add repo secrets (Settings → Secrets → Actions):
#        VERCEL_TOKEN       — https://vercel.com/account/tokens
#        VERCEL_ORG_ID      — from `vercel link` output or project settings
#        VERCEL_PROJECT_ID  — from `vercel link` output or project settings
#   3. Copy .env values into the Vercel project's Environment Variables.
#   4. Optional: add "git": { "deploymentEnabled": false } to vercel.json to
#      disable Vercel's native Git integration (prevents double deploys).
#
# Builds once on the runner and uploads the prebuilt output
# (vercel build + deploy --prebuilt), so nothing builds twice.

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy project artifacts to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
